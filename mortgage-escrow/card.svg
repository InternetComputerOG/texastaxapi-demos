<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150" role="img" aria-label="A home and its monthly payment as one stack"><style>.spot { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } .ink { fill: #000000; } .flat { stroke: none; } .dash { stroke-dasharray: 7 6; } .on { stroke: #000000; } .onf { fill: #000000; stroke: none; } .muted { stroke: #68645c; } .surface { fill: #ffffff; } .sunken { fill: #f0eadb; } .accent { fill: #6e9bff; } .success { fill: #a3f5bf; } .warning { fill: #ffd659; } .sky { fill: #84d6f7; } .sunset { fill: #ffa45e; } .primrose { fill: #ff9fd4; } .sandstone { fill: #ffd2a6; } .lilac { fill: #c6adff; } .gulf { fill: #7fdccb; } .void { fill: #000000; } .onvoid { stroke: #ffffff; } .s-key { stroke: #84d6f7; } .s-string { stroke: #a3f5bf; } .s-number { stroke: #ffd659; } .s-comment { stroke: #8f8b84; } text{font-family:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif}</style><g class="spot"><path class="ink" transform="translate(5 5)" stroke-width="3" d="M20 86l38-32 38 32v50H20z"/> <path class="surface" stroke-width="3" d="M20 86l38-32 38 32v50H20z"/> <rect class="accent" x="48" y="106" width="20" height="30" stroke-width="3"/> <rect class="ink" x="126" y="22" width="52" height="120" rx="6" stroke-width="3"/> <rect class="surface" x="120" y="16" width="52" height="120" rx="6" stroke-width="3"/> <path class="accent flat" d="M121.5 64h49v70.5h-49z"/> <path class="sunken flat" d="M121.5 40h49v24h-49z"/> <path d="M120 40h52M120 64h52"/> <rect x="120" y="16" width="52" height="120" rx="6" stroke-width="3"/></g></svg>
