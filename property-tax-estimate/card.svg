<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150" role="img" aria-label="A tax estimate: a row per taxing unit, a sum line and the total"><style>.spot { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } .ink { fill: #000000; } .flat { stroke: none; } .dash { stroke-dasharray: 7 6; } .on { stroke: #000000; } .onf { fill: #000000; stroke: none; } .muted { stroke: #68645c; } .surface { fill: #ffffff; } .sunken { fill: #f0eadb; } .accent { fill: #6e9bff; } .success { fill: #a3f5bf; } .warning { fill: #ffd659; } .sky { fill: #84d6f7; } .sunset { fill: #ffa45e; } .primrose { fill: #ff9fd4; } .sandstone { fill: #ffd2a6; } .lilac { fill: #c6adff; } .gulf { fill: #7fdccb; } .void { fill: #000000; } .onvoid { stroke: #ffffff; } .s-key { stroke: #84d6f7; } .s-string { stroke: #a3f5bf; } .s-number { stroke: #ffd659; } .s-comment { stroke: #8f8b84; } text{font-family:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif}</style><g class="spot"><rect class="ink" x="58" y="18" width="120" height="124" rx="8" stroke-width="3"/> <rect class="surface" x="52" y="12" width="120" height="124" rx="8" stroke-width="3"/> <rect class="sky" x="64" y="26" width="40" height="14" rx="7"/> <rect class="sunset" x="64" y="50" width="40" height="14" rx="7"/> <rect class="primrose" x="64" y="74" width="40" height="14" rx="7"/> <path stroke-width="3" d="M124 33h36M130 57h30M120 81h40"/> <path stroke-width="3" d="M64 102h96"/> <path stroke-width="5" d="M64 120h30M126 120h34"/> <path class="ink" transform="translate(4 4)" stroke-width="3" d="M30 84c-5-11-16-18-16-34a16 16 0 0 1 32 0c0 16-11 23-16 34z"/> <path class="accent" stroke-width="3" d="M30 84c-5-11-16-18-16-34a16 16 0 0 1 32 0c0 16-11 23-16 34z"/> <circle class="surface on" cx="30" cy="50" r="6" stroke-width="2.5"/></g></svg>
