<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MUD, PID and ESD check for a Texas address</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 56rem; margin: 2rem auto; padding: 0 1rem; }
    input { font: inherit; padding: 0.4rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ccc; }
    .note { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>MUD, PID and ESD check for a Texas address</h1>

  <!-- 1. The address: one lookup through our own server, which holds the key. -->
  <form id="ask">
    <label for="address">Texas street address</label><br />
    <input id="address" size="40" required />
    <button>Look up</button>
  </form>
  <p id="status" role="status"></p>

  <!-- 2. The value and the districts: rechecked in the browser, with no second lookup. -->
  <section id="result" hidden>
    <p><strong id="where"></strong></p>
    <label for="value">Value ($)</label>
    <input id="value" inputmode="decimal" placeholder="Enter the value" />
    <p class="note" id="value-note"></p>
    <p id="none"></p>
    <table id="table">
      <thead><tr><th>District</th><th>Type</th><th>Rate per $100</th><th>Tax</th><th>Share of total</th><th>Purchaser notice</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot><tr><th colspan="3">Total tax, every unit</th><th id="total" colspan="3"></th></tr></tfoot>
    </table>
    <p class="note" id="request-id"></p>
  </section>

  <script type="module">
    import { check } from "./calc.js";

    const $ = (id) => document.getElementById(id);
    const money = (s) => "$" + Number(s).toLocaleString("en-US", { minimumFractionDigits: 2 });
    let body = null; // the last API answer; every recheck reads it

    $("ask").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("status").textContent = "Looking up…";
      const res = await fetch("/lookup?address=" + encodeURIComponent($("address").value));
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.units) {
        // An error answer carries { error: { code, message } }; an ambiguous address lists candidates.
        $("status").textContent = json.error?.message ?? `The lookup was not answered (${res.status}).`;
        $("result").hidden = true;
        return;
      }
      body = json;
      $("status").textContent = "";
      $("where").textContent = `${json.address?.normalized ?? json.address?.input ?? ""}, ${json.county?.name} County`;
      // parcel.value is the appraisal district's value (kind "market" or "assessed"), not a sale price: editable.
      const v = json.parcel?.value;
      $("value").value = v?.amount ?? "";
      $("value-note").textContent = v
        ? `Prefilled with the appraisal district's ${v.kind} value for ${v.tax_year}. Change it to your price.`
        : "The county gives no value for this parcel. Enter the value.";
      $("request-id").textContent = `Request id: ${res.headers.get("x-request-id") ?? "none"}`;
      $("result").hidden = false;
      render();
    });

    $("value").addEventListener("input", render);

    function render() {
      const r = check(
        $("value").value.replace(/[$,\s]/g, ""),
        body.units.map((u) => ({ name: u.name, type: u.type, levy: u.levy, adopted: u.rates?.adopted ?? null })),
      );
      // A lookup returns only what the county lists, so "none listed", never "no notice required".
      $("none").textContent = r && !r.districts.length ? "This parcel's tax records list no MUD, PID or ESD." : "";
      $("table").hidden = !r || !r.districts.length;
      $("total").textContent = r ? money(r.total) + " a year" : "Enter the value as a number of dollars.";
      if (!r) $("none").textContent = "Enter the value as a number of dollars.";
      $("rows").replaceChildren(
        ...(r?.districts ?? []).map((d) => {
          // A PID's amount, when the county prints it, is its assessment.annual; otherwise it comes from the city or county.
          const pidAmount = body.units.find((u) => u.name === d.name)?.assessment?.annual;
          const cells = [
            d.name,
            d.type.toUpperCase(),
            d.rate ?? (d.type === "pid" ? "an assessment" : "no adopted rate yet"),
            d.tax ? money(d.tax) : d.type === "pid" ? (pidAmount ? money(pidAmount) : "from the city or county") : "—",
            d.share_of_total ? (Number(d.share_of_total) * 100).toFixed(2) + "%" : "—",
            d.notice ?? "none; its rate is capped at 10¢ per $100",
          ];
          const row = document.createElement("tr");
          for (const c of cells) {
            const td = document.createElement("td");
            td.textContent = c;
            row.append(td);
          }
          return row;
        }),
      );
    }
  </script>
</body>
</html>
