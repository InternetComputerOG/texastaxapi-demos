<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150" role="img" aria-label="Rent beside the payment it covers"><style>.spot { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } .ink { fill: #000000; } .flat { stroke: none; } .dash { stroke-dasharray: 7 6; } .on { stroke: #000000; } .onf { fill: #000000; stroke: none; } .muted { stroke: #68645c; } .surface { fill: #ffffff; } .sunken { fill: #f0eadb; } .accent { fill: #6e9bff; } .success { fill: #a3f5bf; } .warning { fill: #ffd659; } .sky { fill: #84d6f7; } .sunset { fill: #ffa45e; } .primrose { fill: #ff9fd4; } .sandstone { fill: #ffd2a6; } .lilac { fill: #c6adff; } .gulf { fill: #7fdccb; } .void { fill: #000000; } .onvoid { stroke: #ffffff; } .s-key { stroke: #84d6f7; } .s-string { stroke: #a3f5bf; } .s-number { stroke: #ffd659; } .s-comment { stroke: #8f8b84; } text{font-family:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif}</style><g class="spot"><rect class="ink" x="50" y="34" width="44" height="102" stroke-width="3"/> <rect class="success" x="44" y="28" width="44" height="108" stroke-width="3"/> <rect class="ink" x="116" y="62" width="44" height="74" stroke-width="3"/> <rect class="accent" x="110" y="56" width="44" height="80" stroke-width="3"/> <path class="muted dash" stroke-width="3" d="M32 56h140"/> <path stroke-width="3" d="M20 136h160"/></g></svg>
