<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Texas DSCR calculator with the address's real tax</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 56rem; margin: 2rem auto; padding: 0 1rem; }
    input { font: inherit; padding: 0.4rem; }
    label { display: block; margin-top: 0.75rem; }
    .note { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Texas DSCR calculator with the address's real tax</h1>

  <!-- 1. The address: one lookup through our own server, which holds the key. -->
  <form id="ask">
    <label for="address">Texas street address</label>
    <input id="address" size="40" required />
    <button>Look up</button>
  </form>
  <p id="status" role="status"></p>

  <!-- 2. The rent and the loan: recomputed in the browser, no second lookup. -->
  <section id="result" hidden>
    <p><strong id="where"></strong></p>
    <label for="rent">Rent ($ a month)</label>
    <input id="rent" inputmode="decimal" placeholder="Enter the rent" />
    <label for="price">Price ($)</label>
    <input id="price" inputmode="decimal" placeholder="Enter the price" />
    <p class="note" id="price-note"></p>
    <label for="down">Down payment (percent of the price)</label>
    <input id="down" inputmode="decimal" value="25" />
    <label for="rate">Interest rate (percent a year)</label>
    <input id="rate" inputmode="decimal" value="7" />
    <label for="years">Term (years)</label>
    <input id="years" inputmode="numeric" value="30" />
    <label for="insurance">Insurance ($ a year)</label>
    <input id="insurance" inputmode="decimal" value="2400" />
    <label for="hoa">HOA ($ a month)</label>
    <input id="hoa" inputmode="decimal" value="0" />
    <p id="message"></p>
    <p class="note">
      The tax is at the price with no exemptions (a rental is not a homestead). A PID's assessment is not a tax and is
      not in it. The ratio is a plain number, not a lender's decision.
    </p>
    <p class="note" id="request-id"></p>
  </section>

  <script type="module">
    import { dscr } from "./calc.js";

    const $ = (id) => document.getElementById(id);
    const money = (n) => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const clean = (s) => s.replace(/[$,%\s]/g, "");
    let body = null; // the last API answer; every recompute reads it

    $("ask").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("status").textContent = "Looking up…";
      const res = await fetch("/lookup?address=" + encodeURIComponent($("address").value));
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.units) {
        // An error answer carries { error: { code, message } }; an ambiguous address lists candidates.
        $("status").textContent = json.error?.message ?? `The lookup was not answered (${res.status}).`;
        $("result").hidden = true;
        return;
      }
      body = json;
      $("status").textContent = "";
      $("where").textContent = `${json.address?.normalized ?? json.address?.input ?? ""}, ${json.county?.name} County`;
      // parcel.value is the appraisal district's value, not a sale price: a sale resets it toward the price.
      const v = json.parcel?.value;
      $("price").value = v?.amount ?? "";
      $("price-note").textContent = v
        ? `Prefilled with the appraisal district's ${v.kind} value for ${v.tax_year}. Change it to your price.`
        : "The county gives no value for this parcel. Enter the price.";
      $("request-id").textContent = `Request id: ${res.headers.get("x-request-id") ?? "none"}`;
      $("result").hidden = false;
      render();
    });

    for (const id of ["rent", "price", "down", "rate", "years", "insurance", "hoa"]) $(id).addEventListener("input", render);

    function render() {
      // A PID (levy "assessment") is not a tax: leave it out of the payment.
      const units = body.units
        .filter((u) => u.levy !== "assessment")
        .map((u) => ({ name: u.name, adopted: u.rates?.adopted ?? null }));
      if (!clean($("price").value) || !clean($("rent").value)) {
        $("message").textContent = "Enter the rent and the price.";
        return;
      }
      const r = dscr(
        {
          rent_monthly: clean($("rent").value), price: clean($("price").value), down_pct: clean($("down").value),
          rate_pct: clean($("rate").value), years: clean($("years").value),
          insurance_annual: clean($("insurance").value), hoa_monthly: clean($("hoa").value),
        },
        units,
      );
      if (!r) {
        $("message").textContent =
          "Enter each figure as a number: the down payment at most 100 percent, the term at least one year, and a payment above zero.";
        return;
      }
      // The verdict sentence carries the numbers.
      $("message").textContent =
        `Rent of ${money(clean($("rent").value))} over a monthly payment (PITIA) of ${money(r.pitia)} is a DSCR of ${r.dscr}: ${r.band}.` +
        (r.left_out.length
          ? ` The tax leaves out ${r.left_out.length} unit(s) with no adopted rate yet: ${r.left_out.join(", ")}, so the payment is low and the ratio high.`
          : "");
    }
  </script>
</body>
</html>
